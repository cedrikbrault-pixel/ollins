<style>
:root{--bg:#f4f4ee;--card:#fff;--tx:#141414;--mu:#6b6b60;--ac:#3f8f00;--ye:#c99a00;--bd:#dcdccf;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#171717;--tx:#f2f2e8;--mu:#9a9a8c;--ac:#b6ff1a;--ye:#ffd60a;--bd:#2c2c2c;--rd:#ff5a4d;color-scheme:dark}}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 16px 8px;max-width:980px;margin:auto}
h1{margin:0;font-size:24px;letter-spacing:-.5px}h1 b{color:var(--ac)}h1 i{color:var(--ye);font-style:normal}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:#0d0d0d;border-color:var(--ac);font-weight:700}
.btn.bad{background:#3a1212;color:#ff8a8a;border-color:#ff5a5a;font-weight:700}
.warn{color:#ff8a8a;margin-top:6px;font-size:14px}
main{max-width:980px;margin:auto;padding:8px 16px 40px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.k{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}.v{font-size:26px;font-weight:800}
.pos{color:var(--ac)}.neg{color:var(--rd)}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;min-width:120px}
.t{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.x{background:none;border:0;color:var(--rd);cursor:pointer;font-size:16px}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ye)}
#st{font-size:12px;color:var(--mu);margin-top:6px}
.pb{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.pb .btn{padding:12px 8px;text-align:center;line-height:1.3}.pb small{color:var(--mu)}.pb .btn:active{border-color:var(--ac)}.q{display:inline-flex;gap:6px;align-items:center}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}.tot{font-size:22px;font-weight:800}.ld{min-width:0;width:64px;padding:5px}

function runAdd(f){const d=new FormData(f),r=+d.get('r'),p=String(d.get('p')||'').trim();if(!p||!(r>=0))return false;add('runs',{product:p,revenue:r,emp:d.get('e')||SEL});f.reset();return false}
function RUNS(){
 const list=[...S.runs].sort((a,b)=>b.at-a.at);
 const last=W.length?Math.max(...W.map((w)=>w.at)):0;

let FICHE=null;
const FD=(t)=>new Date(t).toLocaleDateString('fr-FR');
async function updStaff(id,p,note){
 if(db){try{await db.collection('staff').doc(id).update(p)}catch(e){return}}
 else{const it=S.staff.find((x)=>x.id===id);if(!it)return;Object.assign(it,p);save()}
 if(note)add('notes',{emp:id,text:note,auto:1});else render()}
function gradeChg(v){const s=S.staff.find((x)=>x.id===FICHE);if(s&&v!==s.grade)updStaff(s.id,{grade:v},'Grade : '+s.grade+' → '+v)}
function quotaChg(v){const s=S.staff.find((x)=>x.id===FICHE),q=Math.max(1,+v||1);if(s&&q!==s.quota)updStaff(s.id,{quota:q},'Quota : '+s.quota+' → '+q)}
function addNote(){const el=document.getElementById('nt'),t=(el&&el.value||'').trim();if(t)add('notes',{emp:FICHE,text:t})}
function fiche(){
 const s=S.staff.find((x)=>x.id===FICHE);
 if(!s){FICHE=null;return ''}
 const nm='Salaire '+s.name;
 const cur=S.sales.filter((x)=>x.emp===s.name);
 const arch=W.flatMap((w)=>(w.sales||[]).filter((x)=>x.emp===s.name));
 const all=[...arch,...cur];
 const q=(a)=>sum(a,(x)=>x.qty),c=(a)=>sum(a,(x)=>x.total),m=(a)=>sum(a,(x)=>x.total);
 const paidCur=S.expenses.filter((e)=>e.label===nm);
 const paidArch=W.flatMap((w)=>(w.expenses||[]).filter((e)=>e.label===nm));
 const paidAll=[...paidArch,...paidCur].sort((a,b)=>b.at-a.at);
 const due=Math.max(0,pay(s)-sum(paidCur,(e)=>e.amount));
 const bp={};all.forEach((x)=>{const o=bp[x.product]||(bp[x.product]={q:0,c:0});o.q+=x.qty;o.c+=x.total});
 const prod=Object.entries(bp).sort((a,b)=>b[1].q-a[1].q);
 const weeks=[...W].sort((a,b)=>b.at-a.at).map((w)=>{const sa=(w.sales||[]).filter((x)=>x.emp===s.name),pe=(w.expenses||[]).filter((e)=>e.label===nm);return{lab:'Clôturée le '+FD(w.at),q:q(sa),c:c(sa),m:m(sa),p:sum(pe,(e)=>e.amount)}});
 weeks.unshift({lab:'Semaine en cours',q:q(cur),c:c(cur),m:m(cur),p:sum(paidCur,(e)=>e.amount)});
 const notes=S.notes.filter((n)=>n.emp===s.id).sort((a,b)=>b.at-a.at);
 const card=(k,v,cl)=>`<div class="c"><div class="k">${k}</div><div class="v ${cl||''}">${v}</div></div>`;
 const pct=Math.min(100,q(cur)/(s.quota||1)*100);
 return `<div class="c"><button class="btn" onclick="FICHE=null;render()">← Retour au personnel</button><h2 style="margin:12px 0 2px">${esc(s.name)}</h2><div class="k">${esc(s.grade)} • arrivé(e) le ${FD(s.at)}</div></div>
<div class="g">${card('Ventes cette semaine',q(cur))}${card('CA cette semaine',eur(c(cur)))}${card('Marge cette semaine',eur(m(cur)),'pos')}${card('Salaire dû',eur(due),'pos')}</div>
<div class="g">${card('Ventes (total)',q(all))}${card('CA (total)',eur(c(all)))}${card('Marge (total)',eur(m(all)),'pos')}${card('Salaires versés (total)',eur(sum(paidAll,(e)=>e.amount)))}</div>
<div class="g">${card('Courses (total)',[...S.runs,...W.flatMap((w)=>w.runs||[])].filter((x)=>x.emp===s.name).length)}${card('Revenu des courses',eur(sum([...S.runs,...W.flatMap((w)=>w.runs||[])].filter((x)=>x.emp===s.name),(x)=>x.revenue)),'pos')}</div>
<div class="c"><div class="k">Quota de la semaine : ${q(cur)} / ${s.quota}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
<form onsubmit="return false" style="margin-top:10px"><label>Grade<select ${PAT?'':'disabled'} onchange="gradeChg(this.value)">${GRADES.map((g)=>`<option ${g===s.grade?'selected':''}>${g}</option>`).join('')}</select></label><label>Quota (ventes)<input type="number" min="1" value="${s.quota}" ${PAT?'':'disabled'} onchange="quotaChg(this.value)"></label>${PAT?`<label>Nouveau mot de passe<input id="np" type="password" autocomplete="new-password" minlength="8"></label><button type="button" class="btn" onclick="resetPw()">Changer le mot de passe</button>`:''}</form>${AM?`<div class="k" style="margin-top:6px">${AM}</div>`:''}</div>
<div class="c"><div class="k">Produits vendus (depuis le début)</div><div class="t"><table><tr><th>Produit</th><th>Qté</th><th>CA</th></tr>${prod.map(([n,o])=>`<tr><td>${esc(n)}</td><td>${o.q}</td><td>${eur(o.c)}</td></tr>`).join('')||'<tr><td>Aucune vente</td></tr>'}</table></div></div>
<div class="c"><div class="k">Semaine par semaine</div><div class="t"><table><tr><th>Période</th><th>Ventes</th><th>CA</th><th>Marge</th><th>Salaire versé</th></tr>${weeks.map((w)=>`<tr><td>${w.lab}</td><td>${w.q}</td><td>${eur(w.c)}</td><td>${eur(w.m)}</td><td>${eur(w.p)}</td></tr>`).join('')}</table></div></div>
<div class="c"><div class="k">Historique des salaires et primes</div><div class="t"><table><tr><th>Date</th><th>Type</th><th>Montant</th></tr>${paidAll.map((e)=>`<tr><td>${FD(e.at)}</td><td>${esc(e.type)}</td><td>${eur(e.amount)}</td></tr>`).join('')||'<tr><td>Aucun versement</td></tr>'}</table></div></div>
<div class="c"><div class="k">Suivi et notes (promotions, avertissements, remarques)</div><form onsubmit="return false" style="margin:8px 0"><label style="flex:1;min-width:220px">Nouvelle note<input id="nt" placeholder="Ex : très bon service ce soir"></label><button class="btn p" onclick="addNote()">Ajouter</button></form><div class="t"><table>${notes.map((n)=>`<tr><td>${FD(n.at)}</td><td style="white-space:normal">${esc(n.text)}${n.auto?' <span class="k">(auto)</span>':''}</td><td><button class="x" onclick="del('notes','${n.id}')">×</button></td></tr>`).join('')||'<tr><td>Aucune note</td></tr>'}</table></div></div>
<div class="c"><div class="k">Dernières ventes</div><div class="t"><table><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Total</th><th>Client</th></tr>${[...cur].sort((a,b)=>b.at-a.at).slice(0,30).map((x)=>`<tr><td>${new Date(x.at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${eur(x.total)}</td><td>${esc(x.client||'–')}</td></tr>`).join('')||'<tr><td>Aucune vente cette semaine</td></tr>'}</table></div></div>`}
const TH_KEYS={ac:'--ac',ye:'--ye',bg:'--bg',card:'--card',tx:'--tx',mu:'--mu',bd:'--bd'};
const TH_PRE={'Vert lime':{ac:'#b6ff1a',ye:'#ffd60a',bg:'#0d0d0d',card:'#171717',tx:'#f2f2e8',mu:'#9a9a8c',bd:'#2c2c2c'},'Océan':{ac:'#38bdf8',ye:'#fbbf24',bg:'#0a1220',card:'#111c30',tx:'#e8f0fa',mu:'#8fa3bf',bd:'#1e2d47'},'Rouge':{ac:'#ff5a4d',ye:'#ffd60a',bg:'#140b0b',card:'#201212',tx:'#f8eceb',mu:'#b39a98',bd:'#3a2220'},'Violet':{ac:'#c084fc',ye:'#f9a8d4',bg:'#120b1c',card:'#1c1230',tx:'#f1e9fa',mu:'#a597bd',bd:'#33244d'},'Clair':{ac:'#3f8f00',ye:'#c99a00',bg:'#f4f4ee',card:'#ffffff',tx:'#141414',mu:'#6b6b60',bd:'#dcdccf'}};
let TH={};try{TH=JSON.parse(localStorage.getItem('ytth')||'{}')}catch(e){}
function applyTH(){const st=document.documentElement.style;for(const k in TH_KEYS){if(TH[k])st.setProperty(TH_KEYS[k],TH[k]);else st.removeProperty(TH_KEYS[k])}}
function saveTH(){try{localStorage.setItem('ytth',JSON.stringify(TH))}catch(e){}applyTH();render()}
function setTH(k,v){TH[k]=v;saveTH()}
function preTH(n){TH={...TH_PRE[n]};saveTH()}
function resetTH(){TH={};saveTH()}
function cv(k){const v=getComputedStyle(document.documentElement).getPropertyValue(TH_KEYS[k]).trim();return /^#[0-9a-fA-F]{6}$/.test(v)?v:'#888888'}
function COL(){return `<div class="c"><div class="k">Thèmes prêts à l’emploi</div><div class="pb">${Object.keys(TH_PRE).map((n)=>`<button class="btn" onclick="preTH('${n}')">${n}</button>`).join('')}</div></div>
<div class="c"><div class="k">Personnaliser • réglages enregistrés sur cet appareil, visibles par vous seul</div><form onsubmit="return false" style="margin-top:8px">${[['ac','Couleur principale'],['ye','Couleur secondaire'],['bg','Fond'],['card','Cartes'],['tx','Texte']].map(([k,l])=>`<label>${l}<input type="color" value="${TH[k]||cv(k)}" onchange="setTH('${k}',this.value)"></label>`).join('')}<button type="button" class="btn" onclick="resetTH()">Réinitialiser</button></form></div>`}
applyTH();

function toast(m){const e=$('st');e.textContent=m;e.style.color='var(--rd)';setTimeout(()=>{e.textContent=ME?'Connecté : '+ME.name+' ('+ME.grade+')':'';e.style.color=''},4500)}
function logout(){fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'same-origin'}).finally(()=>location.reload())}
function emp(f){const d=new FormData(f);API.req('POST','/api/users',{name:d.get('n'),username:d.get('u'),password:d.get('p'),grade:d.get('g'),quota:+d.get('q')}).then(()=>{AM='Compte créé.';f.reset();return API.sync()}).catch((e)=>{AM=e.message}).finally(render);return false}
function resetPw(){const el=document.getElementById('np'),v=(el&&el.value)||'';if(v.length<8){AM='8 caractères minimum.';render();return}API.req('POST','/api/users/'+FICHE+'/password',{password:v}).then(()=>{AM='Mot de passe modifié.'}).catch((e)=>{AM=e.message}).finally(render)}
function chgPw(f){const d=new FormData(f);API.req('POST','/api/me/password',{old:d.get('o'),new:d.get('n')}).then(()=>{AM2='Mot de passe modifié.';f.reset()}).catch((e)=>{AM2=e.message}).finally(render);return false}
function ACC(){return `<div class="c"><div class="k">Mon compte</div><div>${esc(ME.name)} • ${esc(ME.grade)} • identifiant : ${esc(ME.username)}</div><form onsubmit="return chgPw(this)" style="margin-top:8px"><label>Ancien mot de passe<input name="o" type="password" autocomplete="current-password" required></label><label>Nouveau mot de passe (8 min.)<input name="n" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn p">Changer mon mot de passe</button></form>${AM2?`<div class="k" style="margin-top:8px">${AM2}</div>`:""}${PAT?`<div style="margin-top:12px"><a class="btn" href="/api/export" download style="text-decoration:none;display:inline-block">Télécharger une sauvegarde des données</a></div>`:""}</div>`}
const API=(()=>{
 let rev=0,cache={},subs=[],ready=false;
 async function req(m,u,b){
  const o={method:m,credentials:'same-origin',headers:{}};
  if(b!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
  const r=await fetch(u,o);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!/^\/api\/(login|me|setup)/.test(u)){location.reload();throw new Error('Session expirée')}
  if(!r.ok)throw new Error(j.error||('Erreur '+r.status));
  return j}
 const sigOf=(s)=>JSON.stringify(s.id?((cache[s.c]||[]).find((x)=>x.id===s.id)||null):(cache[s.c]||[]));
 function snap(s){
  if(s.id){const d=(cache[s.c]||[]).find((x)=>x.id===s.id);if(!d)return{id:s.id,exists:false,data:()=>undefined};const{id:_i,...rest}=d;return{id:s.id,exists:true,data:()=>rest}}
  const a=cache[s.c]||[];return{docs:a.map((d)=>{const{id,...rest}=d;return{id,exists:true,data:()=>rest}}),size:a.length,empty:!a.length}}
 function notify(s,force){const g=sigOf(s);if(force||g!==s.last){s.last=g;s.next(snap(s))}}
 async function sync(){const j=await req('GET','/api/sync?rev='+rev);if(j.same)return;rev=j.rev;cache=j.data;ready=true;subs.slice().forEach((s)=>notify(s))}
 function sub(c,id,next){const s={c,id,next,last:null};subs.push(s);if(ready)notify(s,true);return()=>{subs=subs.filter((x)=>x!==s)}}
 const db={collection(c){return{
  async add(o){const j=await req('POST','/api/c/'+c,o);await sync();return{id:j.id}},
  doc(id){return{
   async set(o){await req('PUT','/api/c/'+c+'/'+id,o);await sync()},
   async update(o){await req('PATCH','/api/c/'+c+'/'+id,o);await sync()},
   async delete(){await req('DELETE','/api/c/'+c+'/'+id);await sync()},
   onSnapshot(n){return sub(c,id,n)}}},
  onSnapshot(n){return sub(c,null,n)}}}};
 return{req,sync,db,start(){setInterval(()=>{if(!document.hidden)sync().catch(()=>{})},2500)}}
})();
function loginView(setup){
 $('nav').innerHTML='';
 $('m').innerHTML=`<div class="c" style="max-width:420px;margin:30px auto"><h2 style="margin:0 0 6px">${setup?'Création du compte patron':'Connexion'}</h2><div class="k">${setup?'Premier lancement : crée le compte du patron.':'Entre ton identifiant et ton mot de passe.'}</div><form id="lf" style="flex-direction:column;align-items:stretch;margin-top:12px">${setup?'<label>Nom affiché<input name="n" required></label>':''}<label>Identifiant<input name="u" required autocomplete="username" autocapitalize="none"></label><label>Mot de passe${setup?' (8 caractères min.)':''}<input name="p" type="password" required minlength="${setup?8:1}" autocomplete="${setup?'new-password':'current-password'}"></label><button class="btn p">${setup?'Créer le compte':'Se connecter'}</button><div id="le" class="k" style="color:var(--rd)"></div></form></div>`;
 $('lf').onsubmit=async(ev)=>{ev.preventDefault();const d=new FormData(ev.target);try{const j=await API.req('POST',setup?'/api/setup':'/api/login',setup?{name:d.get('n'),username:d.get('u'),password:d.get('p')}:{username:d.get('u'),password:d.get('p')});begin(j.user)}catch(e){$('le').textContent=e.message}}}
async function begin(u){
 ME=u;CAN=u.admin;PAT=u.patron;SEL=u.name;tab=CAN?'Tableau de bord':'Ventes';db=API.db;
 $('st').textContent='Connecté : '+u.name+' ('+u.grade+')';
 try{await API.sync()}catch(e){$('st').textContent=e.message;return}
 db.collection("settings").doc("pay").onSnapshot((d)=>{if(d.exists)Object.assign(PCT,d.data());render()},()=>{});
 db.collection("wallet").doc("main").onSnapshot((d)=>{if(d.exists)WAL={amount:+d.data().amount||0,at:d.data().at||0};render()},()=>{});
 db.collection("settings").doc("prices").onSnapshot((d)=>{OV=d.exists?d.data():{};applyOV();render()},()=>{});
 db.collection("weeks").onSnapshot((s)=>{W=s.docs.map((d)=>({id:d.id,...d.data()}));render()},()=>{});
 db.collection("settings").doc("loyalty").onSnapshot((d)=>{if(d.exists)LOY=d.data().pts||{};render()},()=>{});
 for(const k in S){db.collection(k).onSnapshot((s)=>{S[k]=s.docs.map((d)=>({id:d.id,...d.data()}));render()},()=>{})}
 API.start();render()}
(async()=>{try{const j=await API.req('GET','/api/me');if(j.user)begin(j.user);else loginView(!!j.setup)}catch(e){$('st').textContent='Serveur injoignable'}})();
</script></body></html>
